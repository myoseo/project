name: Backtest

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-backtest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile main.py
        run: python -m py_compile main.py

      - name: Run backtest
        run: python main.py
